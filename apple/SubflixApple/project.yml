name: SubflixApple
options:
  bundleIdPrefix: com.subflix
  deploymentTarget:
    iOS: "17.0"
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: SubflixApple
    SWIFT_VERSION: 5.10
    INFOPLIST_FILE: Resources/Info.plist
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
packages:
  Clerk:
    url: https://github.com/clerk/clerk-ios
    from: 1.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0
targets:
  SubflixApple:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: Resources
        buildPhase: resources
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    dependencies:
      - package: Clerk
        product: ClerkKit
      - package: Clerk
        product: ClerkKitUI
      - package: Supabase
        product: Supabase
